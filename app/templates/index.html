<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Camel-llama</title>

<style>
    /* Chrome, Edge, Safari */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }

    ::-webkit-scrollbar-track {
        background: transparent;
    }

    ::-webkit-scrollbar-thumb {
        background-color: rgba(120, 120, 120, 0.4);
        border-radius: 10px;
        transition: background-color 0.2s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(120, 120, 120, 0.7);
    }

    /* Firefox */
    * {
        scrollbar-width: thin;
        scrollbar-color: rgba(120, 120, 120, 0.4) transparent;
    }
    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #162a3d;
        color: #eaeaea;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        height: 100vh;
    }

    .container {
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        column-gap:10px;
        flex: 1;
        overflow: hidden;
    }

    .messages {
        flex: 1;
        overflow-y: auto;
        margin-bottom: 20px;
        white-space: pre-wrap;
        line-height: 1.6;
        height: 80vh;
        display: flex;
        flex-direction: column;
        row-gap:10px;
    }

    .input-row {
        display: flex;
        border-top: 1px solid #cecece;
        padding-top: 16px;
    }

    input {
        flex: 1;
        background: #fff;
        border: 1px solid #cecece;
        color: #162a3d;
        padding: 12px;
        border-radius: 6px;
        outline: none;
        font-size: 14px;
    }

    button {
        margin-left: 10px;
        background: #fff;
        border: 1px solid #cecece;
        color: #162a3d;
        padding: 12px 18px;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #cecece;
    }

    .assistant {
        padding: 2px 10px;
        background: #6b7a88;
        border-radius: 10px;
        max-width: 400px;
        min-width: 100px;
    }

    .user {
        padding: 5px 10px;
        background: #8cb8e2;
        border-radius: 10px;
        color: #162a3d;
        width: fit-content;
        display: flex;
        justify-self: end;
        align-self: flex-end;
        max-width: 400px;
    }
</style>
</head>

<body>

<div class="container">
    <div id="messages" class="messages"></div>

    <div class="input-row">
        <input id="input" placeholder="Ask something..." />
        <button onkeydown="(event)=>{event.K}" onclick="handleComnunication()">Send</button>
    </div>
</div>

<script>

const ALL_MESSAGES = [];

const input = document.getElementById("input");
if(input){
    input.addEventListener("keypress", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
            handleComnunication(); 
        }
    });
}

async function readMessage(response,assistantDiv){
 const reader = response.body.getReader();
    const decoder = new TextDecoder("utf-8");

    let buffer = "";

    while(true){
        const {done,value} = await reader.read();
        if(done) break;

        const decodedVal = decoder.decode(value,{stream:true});
        buffer += decodedVal;

        const events = buffer.split("\n\n");
        buffer = events.pop();

        for(const event of events){
            if(event.startsWith("data:")){
                const data = event.replace(/^data:*/, "");

                if(data === "[DONE]"){
                    updateMessageState(false,assistantDiv.innerText);
                    return;
                }
                assistantDiv.innerText += data;
                messages.scrollTop = messages.scrollHeight;
            }
        }
    }
}

const updateMessageState = (isUser,text)=>{
    const newPayload = {};
    
    newPayload['role'] = isUser?'user':"assistant";
    newPayload['content'] = text;

    ALL_MESSAGES.push(newPayload);
}

async function sendMessage(all_messages) {
    
    const assistantDiv = document.createElement("div");
    assistantDiv.className = "assistant";
    messages.appendChild(assistantDiv);

    messages.scrollTop = messages.scrollHeight;

    const response = await fetch("/chat",{
        method:"POST",
        headers:{
            "Content-type":"application/json"
        },
        body:JSON.stringify({all_messages:all_messages})
    });

    return {response,assistantDiv};
}

const readUserInput = () => {
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    const text = input.value.trim();
    input.value = "";
    if(!text) return text;

    const userDiv = document.createElement("div");
    userDiv.className = "user";
    userDiv.innerText = text;
    messages.appendChild(userDiv);

    return text;
}

async function handleComnunication(){
    const userInput = readUserInput();
    if(!userInput) return;
    updateMessageState(true,userInput);
    const {response,assistantDiv} = await sendMessage(ALL_MESSAGES);
    await readMessage(response,assistantDiv);
    console.log({ALL_MESSAGES});
}

</script>

</body>
</html>
